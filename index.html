<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Great India Hindi Video Creator</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6fb;color:#172033}header{background:#111827;color:#fff;padding:24px;text-align:center}main{max-width:1000px;margin:22px auto;padding:0 15px}.card{background:#fff;padding:20px;border-radius:16px;margin:15px 0;box-shadow:0 4px 18px #0001}label{display:block;font-weight:700;margin:12px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #ccd3df;border-radius:9px;font-size:15px}textarea{min-height:170px}button{padding:12px 18px;border:0;border-radius:9px;cursor:pointer;font-weight:700;margin:7px 5px 0 0}.primary{background:#111827;color:#fff}.muted{background:#e5e7eb}.download{display:none;text-decoration:none}#status{margin-top:12px;padding:12px;border-radius:9px;background:#f3f4f6}#canvas{width:100%;background:#111827;border-radius:12px}</style></head><body><header><h1>🎬 Great India Hindi Video Creator</h1><p>Personal Use • Hindi Website Tutorial</p></header><main><div class="card"><h2>1. Website Details</h2><label>Video Title</label><input id="title" value="Website Tutorial"><label>Website URL</label><input id="url" placeholder="https://example.com"><label>Website Photo / Screenshot</label><input id="photo" type="file" accept="image/*"><label>Video Type</label><select id="type"><option value="short">Short Video</option><option value="full">Full Tutorial</option></select></div><div class="card"><h2>2. Hindi Script</h2><textarea id="script" placeholder="नमस्कार, आज हम इस वेबसाइट को इस्तेमाल करना सीखेंगे..."></textarea><button class="muted" onclick="voice()">🔊 Hindi Voice Test</button><button class="muted" onclick="speechSynthesis.cancel()">⏹ Stop</button></div><div class="card"><h2>3. Create Video</h2><button class="primary" onclick="createJob()">🎬 Create Video</button><div id="status">Ready.</div></div><div class="card"><h2>4. Video Download</h2><p id="downloadInfo">Video बनने के बाद नीचे Download Video button दिखाई देगा।</p><a id="downloadLink" class="download"><button class="primary">⬇️ Download Video</button></a><br><button class="muted" onclick="checkLatestVideo()">🔄 Check Video Again</button></div><div class="card"><h2>Preview</h2><canvas id="canvas" width="1280" height="720"></canvas></div></main><script>
const REPO_OWNER='indiaeducat482-collab',REPO_NAME='great-india-hindi-video-creator';let img=null;
photo.onchange=()=>{let f=photo.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{img=new Image();img.onload=draw;img.src=e.target.result};r.readAsDataURL(f)};
function draw(){let c=canvas,x=c.getContext('2d');x.fillStyle='#111827';x.fillRect(0,0,c.width,c.height);x.fillStyle='#fff';x.font='bold 42px Arial';x.fillText(title.value||'Website Tutorial',55,65);x.font='23px Arial';x.fillStyle='#cbd5e1';x.fillText((url.value||'Website URL').slice(0,85),55,108);if(img){let s=Math.min(1120/img.width,500/img.height),w=img.width*s,h=img.height*s;x.drawImage(img,80,145,w,h)}else{x.strokeStyle='#64748b';x.strokeRect(80,145,1120,500);x.fillStyle='#94a3b8';x.font='28px Arial';x.fillText('Upload website screenshot / photo',390,400)}}
function voice(){let t=script.value.trim();if(!t)return alert('पहले Hindi script लिखें।');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='hi-IN';u.rate=.9;speechSynthesis.speak(u)}
function createJob(){let s=script.value.trim();if(!s)return alert('Hindi script लिखें।');let d={title:title.value.trim()||'Website Tutorial',url:url.value.trim(),script:s,type:type.value,createdAt:new Date().toISOString()};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='video-job.json';a.click();status.innerHTML='✅ Job JSON तैयार है। अब GitHub → Actions → Build Hindi Video → Run workflow में यह JSON paste करें। Build पूरा होने के बाद यहाँ <b>Check Video Again</b> दबाएँ।';draw()}
async function checkLatestVideo(){status.textContent='⏳ Latest GitHub Release check हो रहा है...';try{let r=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/latest`,{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error('No release');let d=await r.json();let asset=(d.assets||[]).find(a=>a.name.endsWith('.mp4'));if(!asset)throw new Error('MP4 asset नहीं मिला');downloadLink.href=asset.browser_download_url;downloadLink.download=asset.name;downloadLink.style.display='inline-block';downloadInfo.innerHTML='✅ Video ready: <b>'+asset.name+'</b>';status.innerHTML='✅ Video तैयार है। <b>Download Video</b> पर क्लिक करें।'}catch(e){downloadLink.style.display='none';status.innerHTML='⏳ अभी MP4 release नहीं मिला। पहले GitHub Actions build पूरा करें, फिर <b>Check Video Again</b> दबाएँ।'}}
draw();
</script></body></html>
